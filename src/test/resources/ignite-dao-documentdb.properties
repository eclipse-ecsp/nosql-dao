morphia.map.packages=org.eclipse.ecsp
#Comma separated fully qualified names for Morphia converters
morphia.converters.fqn=org.eclipse.ecsp.nosqldao.mongodb.BytesBufferConverter,org.eclipse.ecsp.nosqldao.mongodb.TestBufferConverter,org.eclipse.ecsp.nosqldao.mongodb.TestEntityCodec,org.eclipse.ecsp.nosqldao.mongodb.TestEntityCodec2
morphia.discriminator.key=className

health.mongo.monitor.enabled=true
health.mongo.needs.restart.on.failure=true
metrics.prometheus.enabled=false
metrics.dao.enabled=false
service.name=test

no.sql.database.type=documentDB
documentdb.name=admin
documentdb.auth.db=admin
documentdb.host=localhost
documentdb.port=27017
documentdb.username=admin
documentdb.password=password
documentdb.connection.params=retryWrites=false